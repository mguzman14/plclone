all:
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    tailscale_key: "{{ lookup('env', 'TS_KEY') }}"

    flota_plc:
      red-entrada:
        subred: "192.168.2.0/24" # 
        dispositivos:
          - nombre: "plc-bombeo-entrada-1"
            ip_fija: "192.168.2.10"
          - nombre: "plc-bombeo-entrada-2"
            ip_fija: "192.168.2.20"
      red-pretratamiento:
        subred: "192.168.3.0/24" # 
        dispositivos:
          - nombre: "plc-reja-desb-1"
            ip_fija: "192.168.3.10"
          - nombre: "plc-reja-desb-2"
            ip_fija: "192.168.3.20"

      red-tanque-mezcla:
        subred: "192.168.4.0/24" # 
        dispositivos:
          - nombre: "plc-tanque-mezcla-1"
            ip_fija: "192.168.4.10"
          - nombre: "plc-tanque-mezcla-2"
            ip_fija: "192.168.4.20"
  
      red-decantador:
        subred: "192.168.5.0/24" # 
        dispositivos:
          - nombre: "plc-tanque-mezcla-1"
            ip_fija: "192.168.5.10"
          - nombre: "plc-tanque-mezcla-2"
            ip_fija: "192.168.5.20"

      red-desinfeccion:
        subred: "192.168.6.0/24" # 
        dispositivos:
          - nombre: "plc-tanque-mezcla-1"
            ip_fija: "192.168.6.10"
          - nombre: "plc-tanque-mezcla-2"
            ip_fija: "192.168.6.20"

      red-dmz:
        subred: "192.168.7.0/24" # Subred que le corresponde
        dispositivos: []
  
  hosts:
    etap:
      ansible_host: "{{ lookup('env', 'HOST1_IP') }}"
      ansible_user: "{{ lookup('env', 'HOST1_USR') }}"
      ansible_become_password: "{{ lookup('env', 'HOST1_PWD') }}"
      ansible_connection: local


   

  children:
    prod:
      hosts:
        etap:
    dev:
      hosts:
        etap: